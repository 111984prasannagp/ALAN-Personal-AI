<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALAN • Personal AI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#02060b;color:#dff9ff;font-family:Inter,Segoe UI,Arial,sans-serif;display:grid;place-items:center;overflow:hidden}
.scene{width:min(1100px,94vw);padding:48px;text-align:center;position:relative}
h1{font-size:clamp(54px,10vw,120px);letter-spacing:.18em;margin:0;text-shadow:0 0 18px #1ccfff}
p{letter-spacing:.28em;color:#8ac9dc}
.orb{width:260px;height:260px;margin:55px auto 35px;border-radius:50%;background:radial-gradient(circle at 50% 42%,#eaffff 0 3%,#45ddff 12%,#0876be 42%,#020b14 70%);box-shadow:0 0 35px #16cfff,0 0 100px #087cc855;position:relative;animation:float 3s ease-in-out infinite}
.orb:before,.orb:after{content:"";position:absolute;inset:-35px;border:2px solid #21d5ff66;border-radius:50%;animation:spin 8s linear infinite}
.orb:after{inset:-65px;border-style:dashed;animation-direction:reverse;animation-duration:12s}
.eye{position:absolute;top:105px;width:58px;height:22px;border-radius:50%;background:#dffcff;box-shadow:0 0 22px #52eaff}.left{left:52px}.right{right:52px}
.badges{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.badge{border:1px solid #27cfff66;border-radius:999px;padding:10px 18px;background:#07131caa}
@keyframes float{50%{transform:translateY(-18px)}}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body><main class="scene"><p>✦ FOUNDER • CREATOR • MAIN DEVELOPER ✦</p><h1>ALAN</h1><div class="orb"><i class="eye left"></i><i class="eye right"></i></div><p>YOUR AI • YOUR SYSTEM • YOUR CONTROL</p><div class="badges"><span class="badge">🧠 MEMORY</span><span class="badge">🎙️ VOICE</span><span class="badge">💻 COMPUTER</span><span class="badge">⚡ AUTOMATION</span><span class="badge">🌐 WEB</span></div><p>G.P. PRASANNA</p></main></body></html>
